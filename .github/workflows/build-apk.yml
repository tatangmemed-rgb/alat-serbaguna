name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'APK/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Simpan APK ke repository
        run: |
          mkdir -p APK
          cp app/build/outputs/apk/debug/app-debug.apk APK/Alat-Serbaguna.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APK/Alat-Serbaguna.apk
          git commit -m "Update APK hasil build" || echo "Tidak ada perubahan APK"
          git push

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alat-Serbaguna-APK
          path: app/build/outputs/apk/debug/app-debug.apk
